<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eurikaa | Explore. Discover. Share.</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 72 96" role="img" aria-label="Location pin">

          </svg>
        </div>
        <p class="brand-name">eurikaa</p>
      </header>

      <p class="tagline">Explore. Discover. Share.</p>

      <section class="cta-card" aria-label="Sign in options">
        <button class="auth-btn facebook">
          <img src="https://www.svgrepo.com/show/452196/facebook-1.svg" alt="" />
          Continue with Facebook
        </button>
        <button class="auth-btn apple">
          <img src="https://www.svgrepo.com/show/452210/apple.svg" alt="" />
          Continue with Apple
        </button>
        <button class="auth-btn google">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" />
          Continue with Google
        </button>

        <div class="divider" aria-hidden="true">
          <span></span>
          <p>or</p>
          <span></span>
        </div>

        <button class="auth-btn email">
          <img src="https://www.svgrepo.com/show/521170/mail-2.svg" alt="" />
          Continue with Email
        </button>
      </section>

      <p class="legal">
        By continuing, you agree to eurikaa's
        <a href="#">Terms &amp; Conditions</a> and
        <a href="#">Privacy Policy</a>.
      </p>
    </main>
  </body>
</html>
